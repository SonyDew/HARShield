[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harshield"
version = "0.1.0"
description = "Offline redaction of common credentials in HTTP Archive files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SonyDev"}]

[project.scripts]
harshield = "harshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
